services:
  - type: web
    name: africore-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_NAME
        value: AFRICORE
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
