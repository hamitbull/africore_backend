name: Build AFRICORE APK

on:
  push:
    branches: [main, build/africore-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.22.2"
          channel: stable
          cache: true

      - name: Restore Android Gradle wrapper and settings
        working-directory: africore_app
        shell: bash
        run: |
          flutter create --platforms=android --org com.africore --project-name app --overwrite /tmp/africore_android_template
          cp /tmp/africore_android_template/android/settings.gradle android/settings.gradle
          cp /tmp/africore_android_template/android/gradle.properties android/gradle.properties
          cp /tmp/africore_android_template/android/gradlew android/gradlew
          cp /tmp/africore_android_template/android/gradlew.bat android/gradlew.bat
          cp -R /tmp/africore_android_template/android/gradle android/gradle
          chmod +x android/gradlew
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle")
          s = p.read_text()
          marker = 'id "org.jetbrains.kotlin.android" version'
          if 'com.google.gms.google-services' not in s:
              lines = s.splitlines()
              out = []
              inserted = False
              for line in lines:
                  out.append(line)
                  if marker in line and not inserted:
                      out.append('    id "org.jetbrains.kotlin.android" version "1.8.22" apply false')
                      out.append('    id "com.google.gms.google-services" version "4.4.2" apply false')
                      inserted = True
              if not inserted:
                  raise SystemExit("Kotlin plugin declaration missing in generated settings.gradle")
              p.write_text("\n".join(out) + "\n")
          PY

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: africore_app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: africore_app
        run: flutter analyze --no-pub

      - name: Build release APK
        working-directory: africore_app
        run: flutter build apk --release

      - name: Verify APK
        run: test -s africore_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: africore-apk
          path: africore_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
